name: FraudGuard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Lint Check
        run: |
          ruff check src tests

      - name: Ruff Format Check
        run: |
          ruff format --check src tests

      - name: Generate Synthetic Pipeline Fixtures
        run: |
          fraudguard generate-synthetic --rows 5000 --days 5 --fraud-rate 0.035 --output data/raw/train_transaction.csv
          fraudguard split --input data/raw/train_transaction.csv --output-dir data/processed
          fraudguard train --models prior amount logistic --output-dir artifacts/baselines
          fraudguard tune --output-dir artifacts/selection --comparison-report reports/development_model_comparison.csv
          fraudguard calibrate --output-dir artifacts/champion
          fraudguard freeze-policy --output reports/freeze_manifest.json

      - name: Run Pytest with Coverage
        run: |
          pytest -p no:cacheprovider --cov=fraudguard --cov-report=term-missing --cov-fail-under=80

      - name: Build code-only container
        run: docker build -t fraudguard:ci .

      - name: Verify container with synthetic trusted bundle
        run: |
          chmod -R a+rX artifacts/champion
          docker run -d --name fraudguard-ci -p 127.0.0.1:8000:8000 \
            --mount type=bind,source="$PWD/artifacts/champion",target=/app/artifacts/champion,readonly \
            fraudguard:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/ready
          curl --fail -X POST http://127.0.0.1:8000/v1/score \
            -H 'Content-Type: application/json' --data-binary @examples/synthetic_transaction.json

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs fraudguard-ci || true
          docker rm -f fraudguard-ci || true
