services:
  - type: web
    name: fraudguard-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn fraudguard.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRAUDGUARD_ARTIFACT_DIR
        value: artifacts/champion
